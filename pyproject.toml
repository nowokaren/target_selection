[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mop-target-selection"
version = "0.2.0.dev0"
description = "Combine target providers and observing surveys for follow-up planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "astropy>=6",
  "requests>=2.31",
  "tomli>=2; python_version < '3.11'",
  "mop-api @ git+https://github.com/nowokaren/mop_api.git@069ee486518f514778b0b102e66bce866e6e6f2b",
]

[project.scripts]
target-selection = "target_selection.cli:main"
target-selection-plan = "target_selection.planning_cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["mkdocs>=1.6,<2"]
interactive = ["prompt_toolkit>=3.0"]
credentials = ["keyring>=25"]

[tool.setuptools]
packages = ["target_selection", "target_selection.sources", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
