[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mop-target-selection"
version = "0.1.0"
description = "Select visible MOP microlensing targets with Rubin data-release coverage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "astropy>=6",
  "mop-api @ git+https://github.com/nowokaren/mop_api.git@44b4831",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["target_selection_pipeline", "data_release_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
