site_name: Target Selection
site_description: Follow-up target selection and observing-planning documentation
site_author: Karen Nowok
repo_name: nowokaren/target_selection
repo_url: https://github.com/nowokaren/target_selection
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 3

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - How it works: how-it-works.md
  - Usage modes: usage-modes.md
  - Configuration: configuration.md
  - Data and cache: data-and-cache.md
  - Products: products.md
  - Product examples: examples.md
  - Architecture: architecture.md
  - API: api.md
  - Data contracts:
      - Overview: contracts/README.md
      - Targets: contracts/targets.md
      - Observations: contracts/observations.md
      - Visibility: contracts/visibility.md
      - Coverage: contracts/coverage.md
      - Priority: contracts/priority.md
      - Provider interface: contracts/provider-interface.md
  - Reading guide: reading-guide.md
  - Tools inventory: tools.md
  - Planning pipeline:
      - Overview: planning_pipeline/README.md
      - Priority overview: planning_pipeline/priority_flow/README.md
      - Priority flow: planning_pipeline/priority_flow/decision_flow.md
      - Decision records: planning_pipeline/decisions/README.md
  - Usage notebooks: usage-notebooks.md
  - OGLE and OPM providers: providers-ogle-opm.md
  - BHTOM access: providers-bhtom.md
  - Quickstart TOMs and local surveys: quickstart_toms_surveys.md
  - Large reference catalogs: reference-catalog.md
  - Terminal visibility reports: visibility-cli.md
  - Catalog sources and adapters: source-adapters.md
  - Rubin RSP access API: rsp-access.md
  - Extending the tool:
      - Adding a source: adding_sources.md
  - Publish on Read the Docs: publishing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

strict: true
